<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 1000" width="1440" height="1000"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#21143D"/><text x="40" y="60" font-family="Arial, sans-serif" font-size="32" fill="#FFF6E4" font-weight="bold">POWIADOMIENIA — STANY UZUPEŁNIAJĄCE</text><rect x="40" y="100" width="660" height="264" rx="24" fill="#FFF6E4"/><text x="64" y="142" font-family="Arial, sans-serif" font-size="23" fill="#21143D" font-weight="bold">Skrzynka jest pusta</text><text x="64" y="187" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Żadnych zaległych wiadomości.</text><text x="64" y="211.3" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Możesz spokojnie wrócić na trasę.</text><rect x="64" y="288" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="64" y="284" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="82" y1="291" x2="654" y2="291" stroke="#FFF0A2" stroke-width="2"/><text x="82" y="313" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Wróć do mapy</text><rect x="740" y="100" width="660" height="264" rx="24" fill="#FFF6E4"/><text x="764" y="142" font-family="Arial, sans-serif" font-size="23" fill="#21143D" font-weight="bold">Przeglądarka blokuje powiadomienia</text><text x="764" y="187" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Poczta w grze nadal działa.</text><text x="764" y="211.3" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Zgodę zmienisz w swojej przeglądarce.</text><rect x="764" y="288" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="764" y="284" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="782" y1="291" x2="1354" y2="291" stroke="#FFF0A2" stroke-width="2"/><text x="782" y="313" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Zostaję przy poczcie w grze</text><rect x="40" y="392" width="660" height="264" rx="24" fill="#FFF6E4"/><text x="64" y="434" font-family="Arial, sans-serif" font-size="23" fill="#21143D" font-weight="bold">Ten ruch jest już zakończony</text><text x="64" y="479" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Pokażemy Twój aktualny postęp.</text><text x="64" y="503.3" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Nie musisz powtarzać decyzji.</text><rect x="64" y="580" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="64" y="576" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="82" y1="583" x2="654" y2="583" stroke="#FFF0A2" stroke-width="2"/><text x="82" y="605" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Pokaż aktualny etap</text><rect x="740" y="392" width="660" height="264" rx="24" fill="#FFF6E4"/><text x="764" y="434" font-family="Arial, sans-serif" font-size="23" fill="#21143D" font-weight="bold">Przypomnienia e-mail wyłączone</text><text x="764" y="479" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Twoja gra i zapisany postęp pozostają.</text><text x="764" y="503.3" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Włączysz je ponownie w ustawieniach.</text><rect x="764" y="580" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="764" y="576" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="782" y1="583" x2="1354" y2="583" stroke="#FFF0A2" stroke-width="2"/><text x="782" y="605" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Wróć do gry</text><rect x="40" y="684" width="660" height="264" rx="24" fill="#FFF6E4"/><text x="64" y="726" font-family="Arial, sans-serif" font-size="23" fill="#21143D" font-weight="bold">Najpierw potwierdź adres e-mail</text><text x="64" y="771" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Przypomnienia uruchomimy dopiero</text><text x="64" y="795.3" font-family="Arial, sans-serif" font-size="18" fill="#21143D">po potwierdzeniu Twojego adresu.</text><rect x="64" y="872" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="64" y="868" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="82" y1="875" x2="654" y2="875" stroke="#FFF0A2" stroke-width="2"/><text x="82" y="897" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Przejdź do konta</text><rect x="740" y="684" width="660" height="264" rx="24" fill="#FFF6E4"/><text x="764" y="726" font-family="Arial, sans-serif" font-size="23" fill="#21143D" font-weight="bold">Nie udało się zapisać ustawień</text><text x="764" y="771" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Dotychczasowe ustawienia pozostają.</text><text x="764" y="795.3" font-family="Arial, sans-serif" font-size="18" fill="#21143D">Możesz spróbować jeszcze raz.</text><rect x="764" y="872" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="764" y="868" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="782" y1="875" x2="1354" y2="875" stroke="#FFF0A2" stroke-width="2"/><text x="782" y="897" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Spróbuj ponownie</text></svg>