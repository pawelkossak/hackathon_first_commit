<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 990" width="1440" height="990"><rect x="0" y="0" width="1440" height="990" rx="0" fill="#21143D"/><text x="40" y="58" font-family="Arial, sans-serif" font-size="32" fill="#FFF6E4" font-weight="bold">PRÓBNE PRZYPOMNIENIE — STANY</text><rect x="40" y="100" width="660" height="260" rx="24" fill="#FFF6E4"/><text x="64" y="142" font-family="Arial, sans-serif" font-size="22" fill="#21143D" font-weight="bold">Najpierw wybierz przeglądarkę</text><text x="64" y="186" font-family="Arial, sans-serif" font-size="17" fill="#21143D">Włącz kanał i udziel zgody, aby wysłać próbę.</text><rect x="64" y="284" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="64" y="280" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="82" y1="287" x2="654" y2="287" stroke="#FFF0A2" stroke-width="2"/><text x="82" y="309" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Ustaw przypomnienia</text><rect x="740" y="100" width="660" height="260" rx="24" fill="#FFF6E4"/><text x="764" y="142" font-family="Arial, sans-serif" font-size="22" fill="#21143D" font-weight="bold">Próbne przypomnienie zaplanowane</text><text x="764" y="186" font-family="Arial, sans-serif" font-size="17" fill="#21143D">Przyjdzie za 30 sekund. Możesz wrócić do gry.</text><rect x="764" y="284" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="764" y="280" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="782" y1="287" x2="1354" y2="287" stroke="#FFF0A2" stroke-width="2"/><text x="782" y="309" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Wróć do gry</text><rect x="40" y="390" width="660" height="260" rx="24" fill="#FFF6E4"/><text x="64" y="432" font-family="Arial, sans-serif" font-size="22" fill="#21143D" font-weight="bold">Przeglądarka blokuje powiadomienia</text><text x="64" y="476" font-family="Arial, sans-serif" font-size="17" fill="#21143D">Baner powrotu nadal działa w grze.</text><rect x="64" y="574" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="64" y="570" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="82" y1="577" x2="654" y2="577" stroke="#FFF0A2" stroke-width="2"/><text x="82" y="599" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Wróć do gry</text><rect x="740" y="390" width="660" height="260" rx="24" fill="#FFF6E4"/><text x="764" y="432" font-family="Arial, sans-serif" font-size="22" fill="#21143D" font-weight="bold">Nie udało się zaplanować próby</text><text x="764" y="476" font-family="Arial, sans-serif" font-size="17" fill="#21143D">Próba nie została dodana. Możesz ponowić.</text><rect x="764" y="574" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="764" y="570" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="782" y1="577" x2="1354" y2="577" stroke="#FFF0A2" stroke-width="2"/><text x="782" y="599" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Spróbuj ponownie</text><rect x="40" y="680" width="660" height="260" rx="24" fill="#FFF6E4"/><text x="64" y="722" font-family="Arial, sans-serif" font-size="22" fill="#21143D" font-weight="bold">Próba została wysłana</text><text x="64" y="766" font-family="Arial, sans-serif" font-size="17" fill="#21143D">Potwierdzenie przyjęcia przez usługę, nie odczytu.</text><rect x="64" y="864" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="64" y="860" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="82" y1="867" x2="654" y2="867" stroke="#FFF0A2" stroke-width="2"/><text x="82" y="889" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Wróć do gry</text><rect x="740" y="680" width="660" height="260" rx="24" fill="#FFF6E4"/><text x="764" y="722" font-family="Arial, sans-serif" font-size="22" fill="#21143D" font-weight="bold">Poczta w grze zawsze działa</text><text x="764" y="766" font-family="Arial, sans-serif" font-size="17" fill="#21143D">Ta przeglądarka nie obsługuje powiadomień.</text><rect x="764" y="864" width="608" height="48" rx="16" fill="#6B3F00"/><rect x="764" y="860" width="608" height="46" rx="16" fill="#FFD447" stroke="#6B3F00" stroke-width="2"/><line x1="782" y1="867" x2="1354" y2="867" stroke="#FFF0A2" stroke-width="2"/><text x="782" y="889" font-family="Arial, sans-serif" font-size="16" fill="#21143D" font-weight="bold">Wróć do gry</text></svg>